<title>TWT | Tasks</title>

<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#fff; color:#1a1a1a; -webkit-text-size-adjust:100%; }

  html[data-theme="dark"] .exp{color:#5a5a60;}
  html[data-theme="dark"] .coda-detail td{background:#151517;border-bottom-color:#242426;}

  html[data-theme="dark"] .u.none{background:rgba(255,255,255,.08);color:#9a9aa0;}
  html[data-theme="dark"] .tw{background:rgba(255,255,255,.08);color:#a0a6b0;}

  html[data-theme="dark"] .mdue{color:#8a8a90;}

  html[data-theme="dark"] .mcard{border-bottom-color:#242426;}

  /* header refresh + appearance */
  .hdr-refresh{width:36px;height:36px;border-radius:50%;border:none;background:#eef4f7;color:#2f6ea8;font-size:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  html[data-theme="dark"] .hdr-refresh{background:rgba(75,192,208,0.16);color:#63d0e0;}
  .theme-tgl{background:none;border:none;padding:4px 6px;color:#9a9a92;font-size:15px;line-height:1;opacity:.5;cursor:pointer;transition:opacity .15s;}

  .cd-inner .details { white-space:pre-wrap; color:#4a4a44; font-size:12px; line-height:1.45; }

  /* ---- shared bits ---- */
  .selbox { width:16px; height:16px; border-radius:4px; border:1.5px solid #c3c3bd; display:inline-block; cursor:pointer; flex:none; }
  .selbox.on { background:#3a5a6c; border-color:#3a5a6c; position:relative; }
  .selbox.on::after { content:"✓"; color:#fff; font-size:11px; position:absolute; left:2px; top:-2px; }
  .pill { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .pill.listing { background:#fbe4e4; color:#c0453f; }
  .pill.buyer   { background:#e3eefb; color:#2f6ea8; }
  .pill.lease   { background:#e2f2e6; color:#3f8a57; }
  .pill.other   { background:#eee; color:#777; }

  .u.yellow { background:#fbeecb; color:#a5822a; }
  .u.red    { background:#fbe0de; color:#c0453f; }
  .u.none   { background:#f0f0ed; color:#9a9a92; }
  .tw { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; background:#eef0f4; color:#6b7280; }

  .rowdone { font:inherit; font-size:11.5px; font-weight:600; background:#57a06e; color:#fff; border:none; border-radius:6px; padding:4px 10px; cursor:pointer; white-space:nowrap; }

  .rowclr { font:inherit; font-size:14px; line-height:1; background:transparent; border:none; color:#9a9a92; cursor:pointer; padding:2px 5px; }
  .rowclr:hover { color:#c0453f; }
  .mmeta .rowact { margin-left:auto; }
  .mmeta .rowdone { font-size:13px; padding:6px 13px; }

  /* ---- mobile cards ---- */
  .mgrp { position:sticky; top:0; background:#f4f6f7; font-weight:600; font-size:13px; color:#33454f; padding:9px 15px; border-bottom:1px solid #e6e9ea; z-index:1; cursor:pointer; user-select:none; }

  .mdetail .kv { display:flex; gap:8px; padding:3px 0; }
  .mdetail .kv .k { color:#8a97a0; width:92px; flex:none; }
  .mdetail .kv a { color:#2f6ea8; text-decoration:none; font-weight:500; }
  .mdetail .details { white-space:pre-wrap; color:#4a4a44; font-size:12px; line-height:1.45; margin-top:4px; }

  .bulkbar { position:fixed; left:50%; transform:translateX(-50%); bottom:20px; background:#22303a; color:#fff; border-radius:12px; padding:10px 12px 10px 18px; display:none; align-items:center; gap:14px; box-shadow:0 8px 30px rgba(0,0,0,.25); z-index:20; font-size:13px; }
  .bulkbar.show { display:flex; }
  .bulkbar .cnt { font-weight:600; }
  .bulkbar button { font:inherit; font-size:13px; font-weight:600; border:none; border-radius:8px; padding:8px 14px; cursor:pointer; }
  .bulkbar .mark { background:#57a06e; color:#fff; }
  .bulkbar .mark:disabled { opacity:.6; cursor:default; }
  .bulkbar .clear { background:transparent; color:#c7d2d8; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:74px; background:#0b0b0b; color:#fff; font-size:12.5px; padding:9px 16px; border-radius:20px; opacity:0; transition:opacity .2s; z-index:21; pointer-events:none; text-align:center; max-width:90%; }
  .toast.show { opacity:1; }
  .toast.err { background:#7a2b26; }

  /* ---- bottom tab bar + More sheet (mobile only) ---- */
  #mtabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:55;height:62px;background:#fff;border-top:1px solid #e6e9ea;}
  #mtabbar .mtab{flex:1;text-align:center;padding:9px 0;color:#8a8a82;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;}
  #mtabbar .mtab .ic{font-size:19px;line-height:1;}
  #mtabbar .mtab span{font-size:10px;font-weight:600;}

  #mscrim{display:none;position:fixed;inset:0;background:rgba(15,20,35,.34);z-index:201;}
  #msheet{display:none;position:fixed;left:0;right:0;bottom:62px;z-index:202;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(20,30,60,.18);padding:8px 12px 16px;}
  #msheet .grab{width:38px;height:4px;border-radius:2px;background:#d8dde6;margin:6px auto 8px;}
  #msheet .mh{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#7c899b;margin:2px 8px 6px;}

<body>
<div class="wrap">
  <div class="coda-bar">
    <div class="tname"><span class="ic">✓</span> Tasks <span class="sub">live from Transaction Checklists</span></div>
    <div style="display:flex;align-items:center;gap:12px;"><div class="sync" id="sync"><span class="d"></span> <span id="synctext">Loading…</span></div><button id="themeToggle" class="theme-tgl" title="Appearance" aria-label="Toggle appearance"><span class="tgl-sun">☾</span><span class="tgl-moon">☀</span></button><button class="hdr-refresh" id="hdrRefresh" title="Refresh">&#8635;</button></div>
  </div>
  <div class="coda-toolbar"><span>⚏ Grouped by Deal</span><span>⛃ Incomplete · full checklist</span><span>↕ Checklist order</span></div>
  <div class="ftabs" id="ftabs"></div>
  <div id="tbl"><div class="state">Loading tasks…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var PROXY="https://script.google.com/macros/s/AKfycbzBRaVa6cwYB93xdKwj-nlibjrIqp4EHGgbHeH4bOhW64CqWAWCy6txHcbbKt5mkaPk/exec";
var KEY=new URLSearchParams(location.search).get("k")||"";
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

var DATA={tasks:[],dealsByAddr:{},nextUp:{}};
var active="all", sel={}, expandedId=null, saving=false;
var COLLAPSE_KEY="twt_tasks_collapsed_v1", collapsed={};
try{ collapsed=JSON.parse(localStorage.getItem(COLLAPSE_KEY))||{}; }catch(e){ collapsed={}; }
var COMPLETED_KEY="twt_tasks_completed_v1", completedIds={}, COMPLETED_TTL=600000;
try{ completedIds=JSON.parse(localStorage.getItem(COMPLETED_KEY))||{}; }catch(e){ completedIds={}; }
function saveCompleted(){ try{ localStorage.setItem(COMPLETED_KEY, JSON.stringify(completedIds)); }catch(e){} }
function escJs(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function trackFromPhase(p){ p=(p||"").toUpperCase(); if(p.indexOf("BUYER")===0)return "buyer"; if(p.indexOf("LEASE")===0)return "lease"; if(p.indexOf("LISTING")===0||p.indexOf("SELLER")===0)return "listing"; return "other"; }
function addrOf(dealStr){ return String(dealStr||"").split("|")[0].trim(); }
// Normalize an address into a match key: uppercase, single spaces, common street
// suffixes abbreviated the same way on both sides (LANE->LN, ROAD->RD, etc.) so
// "140 Rose Cottage Lane" (Deals) matches "140 ROSE COTTAGE LN" (checklist).
var SUFFIX_MAP={LANE:"LN",ROAD:"RD",DRIVE:"DR",COURT:"CT",TRAIL:"TRL",TRACE:"TRCE",CIRCLE:"CIR",TERRACE:"TER",PLACE:"PL",AVENUE:"AVE",BOULEVARD:"BLVD",HIGHWAY:"HWY",PARKWAY:"PKWY",STREET:"ST",POINT:"PT",SQUARE:"SQ"};
function addrKey(s){
  return String(s||"").toUpperCase().replace(/[.,]/g,"").split(/\s+/).filter(Boolean)
    .map(function(w){ return SUFFIX_MAP[w]||w; }).join(" ");
}
function parseDue(v){ if(!v)return null; var d=new Date(v); return isNaN(d)?null:d; }
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function fmtDue(d){ return d? (MONTHS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()) : "—"; }
function urgency(d){
  if(!d) return {cls:"none",label:"No date"};
  var today=startOfDay(new Date()), due=startOfDay(d);
  var n=Math.round((due-today)/86400000);
  if(n<0) return {cls:"red",label:n===-1?"Overdue 1d":"Overdue "+(-n)+"d"};
  if(n<=3) return {cls:"yellow",label:n===0?"Due today":"Due in "+n+"d"};
  return {cls:"green",label:"Due in "+n+"d"};
}
function isMobile(){ return window.matchMedia("(max-width:640px)").matches; }

var TABS=[
  {id:"all",label:"All"},{id:"now",label:"NOW"},{id:"queue",label:"QUEUE"},{id:"upcoming",label:"UPCOMING"},
  {id:"listing",label:"Listings"},{id:"buyer",label:"Buyers"},{id:"lease",label:"Leases"}
];
function matches(t,id){
  if(id==="all")return true;
  if(id==="now")return t.bucket==="NOW";
  if(id==="queue")return t.bucket==="QUEUE";
  if(id==="upcoming")return t.bucket==="UPCOMING";
  return t.track===id;
}
function countFor(id){ var n=0; DATA.tasks.forEach(function(t){ if(!t.done && matches(t,id)) n++; }); return n; }

function transform(feed){
  var dba={};
  // Keyed by UPPERCASED address so "3515 Creek Court" (Deals table) matches
  // "3515 CREEK COURT | Lokesh & Foram" (checklist deal label) regardless of case.
  (feed.deals||[]).forEach(function(d){ var v=d.values||{}; var a=v["Property Address"]; if(a) dba[addrKey(a)]={display:a.trim(),drive:v["Drive Folder"]||"",type:v["Deal Type"]||"",client:v["Client"]||"",city:v["City"]||"",agent:v["Agent"]||"",stage:v["Stage"]||""}; });
  DATA.dealsByAddr=dba;
  // Per-deal "next open task" rollup from the server (covers tasks beyond the window).
  var nu={};
  Object.keys(feed.nextUp||{}).forEach(function(k){ nu[addrKey(addrOf(k))]=feed.nextUp[k]; });
  DATA.nextUp=nu;
  DATA.hasNextUp=!!feed.nextUp; // old proxy version = no rollup; skip caught-up rows then
  var out=[];
  (feed.tasks||[]).forEach(function(t,i){
    var v=t.values||{};
    var addr=addrKey(addrOf(v["Deal"]));
    var deal=dba[addr]||{};
    var due=parseDue(v["Due Date"]);
    out.push({
      id:t.id, task:v["Task"]||t.name||"(task)", dealStr:v["Deal"]||"", addr:addr,
      client:deal.client||(String(v["Deal"]||"").split("|")[1]||"").trim(),
      phase:v["Phase"]||"", track:trackFromPhase(v["Phase"]),
      due:due, bucket:(v["Status"]||""), done:!!v["Complete"],
      notes:v["Notes"]||"", details:v["Details"]||"",
      order:(v["Order"]!=null?Number(v["Order"]):i), phaseNum:(v["Phase #"]!=null?Number(v["Phase #"]):0),
      drive:deal.drive||"", agent:deal.agent||""
    });
  });
  // Keep just-completed tasks hidden until the feed catches up (proxy cache + Coda commit lag).
  var now=(new Date()).getTime(), present={};
  out.forEach(function(t){ present[t.id]=true; });
  Object.keys(completedIds).forEach(function(id){ if(!present[id] || (now-completedIds[id])>COMPLETED_TTL) delete completedIds[id]; });
  out.forEach(function(t){ if(completedIds[t.id]) t.done=true; });
  saveCompleted();
  DATA.tasks=out;
}

function renderTabs(){
  var h="";
  TABS.forEach(function(t,i){ if(i===4) h+="<span class='ftsep'></span>"; h+="<span class='ftab"+(t.id===active?" on":"")+"' onclick=\"setTab('"+t.id+"')\">"+t.label+"<span class='n'>"+countFor(t.id)+"</span></span>"; });
  document.getElementById("ftabs").innerHTML=h;
}

function dispAddr(a){ var d=DATA.dealsByAddr[a]; return (d&&d.display)?d.display:a; }
function trackOfType(ty){ ty=String(ty||"").toLowerCase(); if(ty==="buyer")return "buyer"; if(ty==="lease")return "lease"; if(ty==="listing")return "listing"; return "other"; }
function groupsForRender(){
  var vis=DATA.tasks.filter(function(t){ return !t.done && matches(t,active); });
  var byDeal={};
  vis.forEach(function(t){ (byDeal[t.addr]=byDeal[t.addr]||[]).push(t); });
  var groups=Object.keys(byDeal).map(function(a){
    var rows=byDeal[a].sort(function(x,y){ return (x.phaseNum-y.phaseNum)||(x.order-y.order); });
    var earliest=rows.reduce(function(m,r){ if(r.due&&(!m||r.due<m))return r.due; return m; },null);
    return {addr:a, rows:rows, earliest:earliest};
  });
  groups.sort(function(g1,g2){ if(!g1.earliest&&!g2.earliest)return g1.addr<g2.addr?-1:1; if(!g1.earliest)return 1; if(!g2.earliest)return -1; return g1.earliest-g2.earliest; });
  // Companion tweak: on All (and the per-track tabs), every active deal stays visible.
  // A deal with zero tasks in the window gets a one-line "all caught up" header
  // instead of vanishing - so "caught up" never looks like "checklist missing".
  if(active==="all"||active==="listing"||active==="buyer"||active==="lease"){
    Object.keys(DATA.dealsByAddr).forEach(function(a){
      var d=DATA.dealsByAddr[a];
      if(String(d.stage||"").toLowerCase()==="closed") return;
      if(byDeal[a]) return;
      if(active!=="all" && trackOfType(d.type)!==active) return;
      var nu=DATA.nextUp[a];
      var msg, warn=false;
      if(nu && nu.due){
        var nd=parseDue(nu.due);
        msg="All caught up - next task due "+fmtDue(nd)+": "+nu.task;
      } else if(nu && nu.open>0){
        msg="All dated tasks done - "+nu.open+" open item"+(nu.open>1?"s":"")+" with no date (conditional/ongoing)";
      } else if(nu){
        msg="Every checklist task is done";
      } else {
        msg="No checklist built yet for this deal"; warn=true;
      }
      groups.push({addr:a, rows:[], caughtUp:{msg:msg, warn:warn}});
    });
  }
  return groups;
}

function renderTableHTML(groups){
  var html="<table class='coda'><thead><tr><th style='width:36px'></th><th>Task</th><th>Phase</th><th>Status</th><th>Due Date</th><th style='width:120px'></th></tr></thead><tbody>";
  var any=false;
  groups.forEach(function(g){
    any=true;
    if(g.caughtUp){
      var d0=DATA.dealsByAddr[g.addr]||{};
      var lbl0=dispAddr(g.addr)+(d0.client?" — "+d0.client:"");
      html+="<tr class='grp cu"+(g.caughtUp.warn?" cuwarn":"")+"'><td colspan='6'>"+esc(lbl0)+"<span class='cumsg'>"+(g.caughtUp.warn?"⚠ ":"✓ ")+esc(g.caughtUp.msg)+"</span></td></tr>";
      return;
    }
    var head=g.rows[0];
    var label=dispAddr(g.addr)+(head.client?" — "+head.client:"");
    var isColl=!!collapsed[g.addr];
    html+="<tr class='grp' onclick=\"toggleGroup('"+escJs(g.addr)+"')\"><td colspan='6'><span class='chev'>"+(isColl?"▸":"▾")+"</span>"+esc(label)+"<span class='cnt'>"+g.rows.length+"</span></td></tr>";
    if(!isColl) g.rows.forEach(function(t){
      var isSel=!!sel[t.id]; var u=urgency(t.due);
      var whenT=t.notes?String(t.notes).replace(/^Timing:\s*/,""):"";
      var statusCell=t.due?("<span class='u "+u.cls+"'>"+u.label+"</span>"):"";
      var dueCell=t.due?fmtDue(t.due):(whenT?"<span class='tw'>"+esc(whenT)+"</span>":"");
      var box="<span class='selbox"+(isSel?" on":"")+"' onclick=\"event.stopPropagation();toggleSel('"+t.id+"')\"></span>";
      html+="<tr class='taskrow"+(isSel?" sel":"")+"' onclick=\"toggleExpand('"+t.id+"')\">"+
        "<td style='text-align:center'>"+box+"</td>"+
        "<td class='task-cell'>"+esc(t.task)+"</td>"+
        "<td><span class='pill "+t.track+"'>"+esc(t.phase)+"</span></td>"+
        "<td>"+statusCell+"</td>"+
        "<td>"+dueCell+"</td>"+
        "<td style='text-align:right; padding-right:14px'>"+(isSel? rowActionHTML() : "<span class='exp'>⤢</span>")+"</td></tr>";
      if(expandedId===t.id) html+=detailRowHTML(t);
    });
  });
  if(!any) html+="<tr><td colspan='6' class='state'>Nothing here — you're all caught up for this filter. 🎉</td></tr>";
  html+="</tbody></table>";
  return html;
}

function renderCardsHTML(groups){
  var any=false, html="";
  groups.forEach(function(g){
    any=true;
    if(g.caughtUp){
      var d0=DATA.dealsByAddr[g.addr]||{};
      var lbl0=dispAddr(g.addr)+(d0.client?" — "+d0.client:"");
      html+="<div class='mgrp cu"+(g.caughtUp.warn?" cuwarn":"")+"'>"+esc(lbl0)+"<div class='cumsg'>"+(g.caughtUp.warn?"⚠ ":"✓ ")+esc(g.caughtUp.msg)+"</div></div>";

      var isSel=!!sel[t.id]; var u=urgency(t.due);

      html+="<div class='mcard"+(isSel?" sel":"")+"' onclick=\"toggleExpand('"+t.id+"')\">"+
        "<div class='mrow'>"+
          "<span class='selbox"+(isSel?" on":"")+"' onclick=\"event.stopPropagation();toggleSel('"+t.id+"')\"></span>"+
          "<div class='mtask'>"+esc(t.task)+"</div>"+

          "<span class='pill "+t.track+"'>"+esc(t.phase)+"</span>"+
          statusM+
          dueM+
          (isSel? rowActionHTML() : "")+
        "</div>"+
        (expandedId===t.id? mDetailHTML(t) : "")+

  if(!any) html="<div class='state'>Nothing here — you're all caught up for this filter. 🎉</div>";

var lastMobile=null;
function render(){
  var groups=groupsForRender();
  lastMobile=isMobile();
  document.getElementById("tbl").innerHTML = lastMobile ? renderCardsHTML(groups) : renderTableHTML(groups);
  renderTabs();
  updateBar();
}
window.addEventListener("resize", function(){ if(isMobile()!==lastMobile) render(); });

function setTab(id){ active=id; render(); }
function toggleGroup(k){ if(collapsed[k])delete collapsed[k]; else collapsed[k]=true; try{localStorage.setItem(COLLAPSE_KEY,JSON.stringify(collapsed));}catch(e){} render(); }
function toggleExpand(id){ expandedId = (expandedId===id)?null:id; render(); }
function toggleSel(id){ if(sel[id])delete sel[id]; else sel[id]=true; render(); }
function clearSel(){ sel={}; render(); }
function updateBar(){}

var tt;
function showToast(m,isErr){ var el=document.getElementById("toast"); el.textContent=m; el.className="toast show"+(isErr?" err":""); clearTimeout(tt); tt=setTimeout(function(){el.className="toast";},3200); }

function completeOne(id, tries){
  tries = tries || 0;
  return fetch(PROXY+"?k="+encodeURIComponent(KEY)+"&action=setcomplete&row="+encodeURIComponent(id)+"&val=1",{redirect:"follow"})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res && res.ok) return true;
      if(tries<3) return new Promise(function(rs){setTimeout(rs,600*(tries+1));}).then(function(){return completeOne(id,tries+1);});
      return false;
    })
    .catch(function(){
      if(tries<3) return new Promise(function(rs){setTimeout(rs,600*(tries+1));}).then(function(){return completeOne(id,tries+1);});
      return false;
    });
}
function markSelectedDone(){
  var ids=Object.keys(sel); if(!ids.length||saving) return;
  saving=true; render();
  var okc=0;
  var chain=ids.reduce(function(p,id){ return p.then(function(){ return completeOne(id).then(function(ok){ if(ok){okc++; completedIds[id]=(new Date()).getTime(); var t=DATA.tasks.find(function(x){return x.id===id;}); if(t)t.done=true;} }); }); }, Promise.resolve());
  chain.then(function(){
    saving=false; sel={}; saveCompleted();
    render();
    if(okc===ids.length) showToast("✓ "+okc+" task"+(okc>1?"s":"")+" marked done · synced to Transaction Checklists + Dashboard");
    else showToast("Marked "+okc+" of "+ids.length+" — some didn't save. Refreshing…", true);
    setTimeout(load, 2500);
  });
}

function setSync(txt, stale){ document.getElementById("synctext").textContent=txt; document.getElementById("sync").classList.toggle("stale",!!stale); }
var CACHE_KEY="twt_tasks_feed_v1";var hasShown=false;var lastLoad=0;
function renderFromCache(){try{var c=localStorage.getItem(CACHE_KEY);if(c){transform(JSON.parse(c));render();hasShown=true;var n=DATA.tasks.filter(function(t){return !t.done;}).length;setSync(n+" open - refreshing");return true;}}catch(e){}return false;}
function load(){
  lastLoad=Date.now();
  if(!hasShown) setSync("Refreshing…");
  fetch(PROXY+"?k="+encodeURIComponent(KEY)+"&action=alltasks",{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(feed){
      try{localStorage.setItem(CACHE_KEY,JSON.stringify(feed));}catch(e){}hasShown=true;
      transform(feed);
      expandedId=null;
      render();
      var n=DATA.tasks.filter(function(t){return !t.done;}).length;
      setSync(n+" open · updated just now");
    })
    .catch(function(e){ if(hasShown){setSync("Showing saved - offline", true);return;} setSync("Couldn't load — tap to retry", true); document.getElementById("tbl").innerHTML="<div class='state'>Couldn't reach the data. Tap the status to retry.</div>"; });
}
if(!KEY){ document.getElementById("tbl").innerHTML="<div class='state'>Missing access key in the URL (?k=…).</div>"; setSync("No key", true); }
else { renderFromCache(); load(); }
function maybeRefresh(){ if(document.visibilityState==="visible" && (Date.now()-lastLoad)>30000) load(); }
document.addEventListener("visibilitychange", maybeRefresh);
window.addEventListener("focus", maybeRefresh);

(function(){
  function save(v){try{localStorage.setItem('twt-theme',v);}catch(e){}}
  function clr(){try{localStorage.removeItem('twt-theme');}catch(e){}}
  function ovr(){try{var o=localStorage.getItem('twt-theme');return (o==='dark'||o==='light')?o:null;}catch(e){return null;}}
  function sys(){try{return (window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}catch(e){return 'light';}}
  function cur(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
  function apply(){document.documentElement.setAttribute('data-theme', ovr()||sys());}
  function syncSeg(){var mode=ovr()||'auto';var seg=document.getElementById('segAppear');if(!seg)return;var bs=seg.querySelectorAll('button');for(var i=0;i<bs.length;i++){bs[i].classList.toggle('on', bs[i].getAttribute('data-appear')===mode);}}
  syncSeg();
  document.addEventListener('click',function(e){
    var g=e.target&&e.target.closest?e.target.closest('#themeToggle'):null;
    if(g){var nx=cur()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);save(nx);syncSeg();return;}
    var s=e.target&&e.target.closest?e.target.closest('#segAppear button'):null;
    if(s){var m=s.getAttribute('data-appear');if(m==='auto'){clr();}else{save(m);}apply();syncSeg();return;}
  });
  try{var mq=window.matchMedia('(prefers-color-scheme:dark)');if(mq&&mq.addEventListener){mq.addEventListener('change',function(){if(!ovr()){document.documentElement.setAttribute('data-theme',sys());}});}}catch(e){}
})();</script>
